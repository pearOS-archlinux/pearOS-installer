<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="css/assistant-styles.css">
    <title>pearOS NiceC0re Installer</title>
  </head>
  <body id="language-selection-page">
    <div class="flex-container">
      <div class="app">
        <div class="tabs">
          <div class="tab active">
            <img class="worldmap" src="resources/country.png"/>
            <h1>Select Your Language</h1>
            <div class="countries">
              <select class="list" size=9 id="ddlViewBy">
                <option value="zh_CN.UTF-8">Chinese (Simplified)</option>
                <option value="en_AU.UTF-8">English (Australia)</option>
                <option value="en_CA.UTF-8">English (Canada)</option>
                <option value="en_US.UTF-8">English (United States)</option>
                <option value="en_GB.UTF-8">English (United Kingdom)</option>
                <option value="cs_CZ.UTF-8">Czech (Czech Republic)</option>
                <option value="fr_FR.UTF-8">French (France)</option>
                <option value="de_DE.UTF-8">German (Germany)</option>
                <option value="it_IT.UTF-8">Italian (Italy)</option>
                <option value="ja_JP.UTF-8">Japanese (Japan)</option>
                <option value="pt_BR.UTF-8">Portuguese (Brazil)</option>
                <option value="pt_PT.UTF-8">Portuguese (Portugal)</option>
                <option value="ru_RU.UTF-8">Russian (Russia)</option>
                <option value="ro_RO.UTF-8">Romanian (Romania)</option>
                <option value="es_MX.UTF-8">Spanish (Mexico)</option>
                <option value="es_ES.UTF-8">Spanish (Spain)</option>
                <option value="sv_SE.UTF-8">Swedish (Sweden)</option>
                <option value="hu_HU.UTF-8">Hungarian (Hungary)</option>
              </select>
            </div>
          </div>
        </div>
        <div class="movement-buttons">
          <hr style="color:#ffffff">
          <div class="arrow-button-container">
            <button onclick="select_language();" class="nav-button button" type="button" id="move-forward-btn">Continue</button>
          </div>
        </div>
      </div>
    </div>
  </body>
  <script src="js/engine.js"></script>
</html>
