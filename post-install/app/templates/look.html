<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" type="text/css" href="../css/assistant-styles.css">
    <title data-i18n="look.pageTitle">pearOS NiceC0re Installer</title>
  </head>
  <body data-step="look">
    <div class="flex-container">
      <div class="app">
        <div class="tabs">
          <div class="tab active">
            <br>
            <h1 data-i18n="look.title">Choose Your Look</h1>
            <div class="look-picker">
              <div class="look-option" data-mode="light">
                <div class="look-preview look-preview-light">
                  <div class="look-preview-bar"></div>
                  <div class="look-preview-dock"></div>
                </div>
                <span data-i18n="look.lightLabel">Light</span>
              </div>
              <div class="look-option" data-mode="dark">
                <div class="look-preview look-preview-dark">
                  <div class="look-preview-bar"></div>
                  <div class="look-preview-dock"></div>
                </div>
                <span data-i18n="look.darkLabel">Dark</span>
              </div>
            </div>
            <p class="look-note">
              <span data-i18n="look.noteMain">Select a light or dark appearance and see how the Dock, menus, buttons, and windows adjust depending on which one you choose.</span>
              <br><br>
              <span data-i18n="look.noteChange">You can change this later in System Settings.</span>
            </p>
            <br>
          </div>
        </div>
        <div class="movement-buttons">
          <hr style="color:#ffffff">
          <div class="arrow-button-container">
            <button data-nav="-1" type="button" id="move-back-btn">
              <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
              </svg>
            </button>
          </div>
          <div class="arrow-button-container">
            <button data-nav="+1" class="nav-button button" type="button" id="move-forward-btn" data-i18n="look.continue">Continue</button>
          </div>
        </div>
      </div>
    </div>
    <script src="../js/engine.js"></script>
    <script src="../js/i18n.js"></script>
    <script>i18n.load(); initLookPicker();</script>
  </body>
</html>
