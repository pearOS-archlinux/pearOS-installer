<!DOCTYPE html>
<!-- disk -->
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" type="text/css" href="../css/assistant-styles.css">
    <title >pearOS NiceC0re disk</title>
  </head>
  <body data-step="disk">
    <div class="flex-container">
      <div class="app page-install-wrapper">
        <div class="tabs">
          <div class="tab active">
            <img class="release-logo-agreement" height="350px" src="../resources/nicec0re-logo.png" alt="pearOS NiceC0re logo"/>
            <h1><b>pearOS NiceC0re</b></h1>
            <p align="center" class="setup-text" id="disk-install-text" data-i18n="disk.selectText">Select the disk where you want to install pearOS.</p>
            <ul id="disk_list" class="ul_menu_disk">
              <form></form>
            </ul>
          </div>
        </div>
        <div class="movement-buttons">
          <div class="grid-container-disk">
            <button data-nav="-1" class="install-button-agreement" data-i18n="common.back"> Back </button>
            <button onclick="showEraseModal();" class="install-button-agreement" data-nav="1" id="move-forward-btn" data-i18n="common.continue"> Continue </button>
          </div>
        </div>
      </div>
    </div>
    <div id="erase-modal" class="agreement-modal">
      <div class="agreement-modal-content" style="height: auto; max-height: 500px;">
        <img class="agreement-modal-logo" height="100px" src="../resources/nicec0re-logo.png"/>
        <p class="agreement-modal-text" style="font-size: 16px; margin-bottom: 15px;"><b data-i18n="disk.eraseTitle">This will ERASE the selected disk.</b></p>
        <p class="agreement-modal-text" style="font-size: 12px; font-weight: normal; margin-bottom: 20px; line-height: 1.6;" data-i18n="disk.eraseWarning">If you want to dual boot, go back one step and hold ALT while clicking Continue to open the offline & dual boot installer. Thank you for your understanding.</p>
        <div class="agreement-modal-buttons">
          <button onclick="closeEraseModal();" class="install-button-agreement" data-i18n="common.cancel">Cancel</button>
          <button onclick="confirmErase();" class="install-button-agreement" data-i18n="common.continue">Continue</button>
        </div>
      </div>
    </div>
  </body>
  <script src="../js/engine.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/disk.js"></script>
  <script src="../js/navbar.js"></script>
  <script src="../js/focus-fix.js"></script>
</html>
