<!DOCTYPE html>
<!-- menu -->
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" type="text/css" href="../css/assistant-styles.css">
    <title>pearOS NiceC0re menu</title>
  </head>
  <body data-step="menu">
    <div class="flex-container">
      <div class="menu">
        <ul class="ul_menu">
          <label class="menu_checkbox_label" ondblclick="handleMenuAction('packup')">
            <input type="checkbox" class="menu_checkbox" id="menu_packup" value="packup" checked>
            <img class="menu_logo" height="50px" src="../resources/packup-logo.png" alt="Packup restore logo" />
            <p class="menu_title"><b data-i18n="menu.restore">Restore from Time Machine</b></p>
            <p class="menu_description" data-i18n="menu.restoreDesc">If you have packup of your system that you want to restore</p>
          </label>
          <label class="menu_checkbox_label" ondblclick="handleMenuAction('installer')">
            <input type="checkbox" class="menu_checkbox" id="menu_installer" value="installer">
            <img class="menu_logo" height="50px" src="../resources/nicec0re-logo.png" alt="pearOS installer logo" />
            <p class="menu_title" id="menu_installer_title" data-default-title="menu.install" data-alt-title="menu.installAlt"><b data-i18n="menu.install">Install pearOS NiceC0re</b></p>
            <p class="menu_description" id="menu_installer_desc" data-default-desc="menu.installDesc" data-alt-desc="menu.installAltDesc"><span data-i18n="menu.installDesc">Use the attached installer to Upgrade or Install pearOS.</span></p>
          </label>
          <label class="menu_checkbox_label" ondblclick="handleMenuAction('browser')">
            <input type="checkbox" class="menu_checkbox" id="menu_browser" value="browser">
            <img class="menu_logo" height="50px" src="../resources/firefox-logo.png" alt="Firefox browser logo" />
            <p class="menu_title"><b data-i18n="menu.browser">Web Browser</b></p>
            <p class="menu_description" data-i18n="menu.browserDesc">Browse for support to get help with your Computer</p>
          </label>
          <label class="menu_checkbox_label" ondblclick="handleMenuAction('gparted')">
            <input type="checkbox" class="menu_checkbox" id="menu_gparted" value="gparted">
            <img class="menu_logo" height="50px" src="../resources/gparted.svg" alt="GParted disk partitioning logo" />
            <p class="menu_title"><b data-i18n="menu.gparted">GParted</b></p>
            <p class="menu_description" data-i18n="menu.gpartedDesc">Repair or erase a disk using GParted</p>
          </label>
        </ul>
        <div class="movement-buttons">
          <button data-nav="-1" class="install-button-agreement" data-i18n="common.back">Back</button>
          <div style="width: 100%;">
            <span class="alt-hint" style="margin-left: 12px; font-size: 12px; opacity: 0.8; color: #595959;" data-i18n="menu.altHint">Hold ⌥ (Alt) for Offline installer & Dual Boot</span>
            <button data-nav="1" class="install-button-agreement" id="menu-continue-btn" data-i18n="common.continue">Continue</button>
          </div>
        </div>
      </div>
    </div>
    <div class="agreement-modal" id="install-choice-modal">
      <div class="agreement-modal-content install-choice-modal-content">
        <img class="agreement-modal-logo" src="../resources/nicec0re-logo.png" />
        <p class="agreement-modal-text" data-i18n="menu.howToInstall">How would you like to install pearOS?</p>
        <div class="agreement-modal-buttons">
          <button class="install-button-agreement" onclick="chooseInstallType('offline')" data-i18n="menu.offlineInstall">Offline Install &amp; Dual Boot</button>
          <button class="install-button-agreement" style="background-color:#1d7adc;" onclick="chooseInstallType('online')" data-i18n="menu.onlineInstall">Online Install</button>
        </div>
      </div>
    </div>
  </body>
  <script src="../js/engine.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/menu.js"></script>
  <script src="../js/apps.js"></script>
  <script src="../js/navbar.js"></script>
  <script src="../js/focus-fix.js"></script>
</html>
